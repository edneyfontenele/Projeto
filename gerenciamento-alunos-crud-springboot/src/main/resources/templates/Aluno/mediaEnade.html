<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <title>Média do Enade - Sistema de Gerenciamento de Alunos</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.2/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
</head>
<body>

    <div th:replace="fragmentos/fragmentos :: cabecalho"></div>

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-info text-white text-center">
                <h3><i class="bi bi-calculator"></i> Média do Enade</h3>
            </div>
            <div class="card-body text-center">
                <h4 class="card-title">Média Geral das Notas do Enade</h4>
                <p class="card-text text-muted">Calculada com base nas notas dos <strong>alunos ativos</strong> cadastrados no sistema.</p>
                <hr>
                <h1 class="display-3 text-primary" th:text="${#numbers.formatDecimal(mediaEnade, 1, 2)}"></h1>
                <hr>
                <p class="text-secondary">
                    Total de alunos ativos considerados no cálculo: <strong th:text="${totalAlunos}"></strong>
                </p>
                <a th:href="@{/index}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Voltar</a>
            </div>
        </div>
    </div>

    <script src="/webjars/jquery/3.6.0/jquery.min.js"></script>
    <script src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
