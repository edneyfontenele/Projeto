version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_banco_dados
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Exercicios
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_banco_dados
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
